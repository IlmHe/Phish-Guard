<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🚨 Phish Guard Security Alert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            width: 400px;
            height: 500px;
            padding: 20px;
            overflow: hidden;
        }

        .alert-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .alert-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .alert-icon {
            font-size: 64px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .alert-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 5px;
        }

        .alert-subtitle {
            font-size: 14px;
            color: #a8a8a8;
        }

        .alert-content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #a8a8a8;
        }

        .info-value {
            font-weight: bold;
            color: #fff;
        }

        .risk-score {
            font-size: 20px;
        }

        .risk-high {
            color: #ff4757;
        }

        .risk-medium {
            color: #ffa502;
        }

        .domain-text {
            color: #70a1ff;
            word-break: break-all;
        }

        .alert-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ff4757;
            color: white;
        }

        .btn-primary:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .resource-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .resource-item {
            background: rgba(255, 71, 87, 0.1);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="alert-container">
        <div class="alert-header">
            <div class="alert-icon">🚨</div>
            <div class="alert-title">Security Alert</div>
            <div class="alert-subtitle">Automatic monitoring detected high-risk resources</div>
        </div>

        <div class="alert-content">
            <div class="info-row">
                <span class="info-label">Domain:</span>
                <span class="info-value domain-text" id="domain">Loading...</span>
            </div>

            <div class="info-row">
                <span class="info-label">Risk Score:</span>
                <span class="info-value risk-score" id="riskScore">--</span>
            </div>

            <div class="info-row">
                <span class="info-label">Suspicious Resources:</span>
                <span class="info-value" id="suspiciousCount">--</span>
            </div>

            <div class="resource-list" id="resourceList"></div>
        </div>

        <div class="alert-actions">
            <button type="button" class="btn btn-secondary" id="dismissBtn">Dismiss</button>
            <button type="button" class="btn btn-primary" id="detailsBtn">View Full Scan</button>
        </div>
    </div>

    <script src="alert.js"></script>
</body>
</html>
